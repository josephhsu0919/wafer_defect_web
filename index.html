
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>食品外觀瑕疵即時分類</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 16px;
      background: #f7f7f7;
    }
    h2 {
      font-size: 26px;
      margin-bottom: 16px;
    }
    video {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: #000;
    }
    .box {
      background: white;
      max-width: 420px;
      margin: 16px auto;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .result {
      font-size: 26px;
      font-weight: bold;
      margin-top: 10px;
    }
    .prob {
      font-size: 18px;
      margin-top: 10px;
      line-height: 1.6;
    }
    .note {
      font-size: 13px;
      color: #666;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <h2>食品外觀瑕疵即時分類</h2>

  <video id="video" autoplay playsinline muted></video>

  <div class="box">
    <div class="result" id="result">模型載入中...</div>
    <div class="prob" id="prob"></div>
    <div class="note">請使用手機瀏覽器開啟，並允許相機權限。</div>
  </div>

<script>
  let model;
  const classNames = ["defect", "normal"];

  async function loadModel() {
    try {
      model = await tf.loadLayersModel("./model/model.json");
      document.getElementById("result").innerText = "模型已載入，啟動相機中...";
      startCamera();
    } catch (error) {
      document.getElementById("result").innerText = "模型載入失敗";
      document.getElementById("prob").innerText = error.message;
      console.error(error);
    }
  }

  async function startCamera() {
    try {
      const video = document.getElementById("video");

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment"
        },
        audio: false
      });

      video.srcObject = stream;

      video.onloadedmetadata = () => {
        predictLoop();
      };
    } catch (error) {
      document.getElementById("result").innerText = "相機啟動失敗";
      document.getElementById("prob").innerText = error.message;
      console.error(error);
    }
  }

  function preprocessImage(video) {
    return tf.tidy(() => {
      let img = tf.browser.fromPixels(video);
      img = tf.image.resizeBilinear(img, [224, 224]);
      img = img.toFloat().div(255.0);
      img = img.expandDims(0);
      return img;
    });
  }

  async function predictLoop() {
    const video = document.getElementById("video");

    if (model && video.readyState === 4) {
      const input = preprocessImage(video);
      const prediction = model.predict(input);
      const probs = await prediction.data();

      input.dispose();
      prediction.dispose();

      let maxIndex = 0;
      for (let i = 1; i < probs.length; i++) {
        if (probs[i] > probs[maxIndex]) {
          maxIndex = i;
        }
      }

      document.getElementById("result").innerText =
        classNames[maxIndex] + "：" + (probs[maxIndex] * 100).toFixed(1) + "%";

      let txt = "";
      for (let i = 0; i < classNames.length; i++) {
        txt += classNames[i] + "：" + (probs[i] * 100).toFixed(1) + "%<br>";
      }

      document.getElementById("prob").innerHTML = txt;
    }

    setTimeout(predictLoop, 500);
  }

  loadModel();
</script>

</body>
</html>
